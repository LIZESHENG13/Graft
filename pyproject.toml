[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graft-recommendation"
version = "0.1.0"
description = "New Items Need Grafting: Expanding Semantic Paths for Inductive Recommendation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.2,<3",
  "scikit-learn>=1.3,<2",
  "threadpoolctl>=3",
  "pandas>=2,<3",
]

[project.optional-dependencies]
encoder = ["recbole==1.2.1", "PyYAML>=6"]
dev = ["pytest>=8", "build>=1", "ruff>=0.6"]
text = ["sentence-transformers>=3,<7"]

[project.scripts]
graft = "graft.__main__:main"

[tool.setuptools.packages.find]
include = ["graft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]
